<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Amrutha Multi Cuisine Family Restaurant | Gather at Amrutha</title>
    <meta name="description" content="Meet at Amrutha Multi Cuisine Family Restaurant. A welcoming place for family meals, with pickup and delivery available. Explore how to enjoy Amrutha." />
    <meta name="robots" content="index, follow" />
    <link id="canonical-url" rel="canonical" />
    <meta property="og:title" content="Amrutha Multi Cuisine Family Restaurant" />
    <meta property="og:description" content="A welcoming place for family meals, with pickup and delivery available." />
    <meta property="og:url" content="" />
    <meta property="og:image" content="/amrutha-table.jpg" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Amrutha Multi Cuisine Family Restaurant" />
    <meta name="twitter:description" content="A welcoming place for family meals, with pickup and delivery available." />
    <meta name="twitter:image" content="/amrutha-table.jpg" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Restaurant",
        "name": "Amrutha Multi Cuisine Family Restaurant",
        "description": "A multi-cuisine family restaurant offering pickup and delivery."
      }
    </script>
    <script>
      (() => {
        const site = window.location.origin.replace(/\/$/, '');
        document.getElementById('canonical-url').setAttribute('href', site + '/');
        document.querySelector('meta[property="og:url"]').setAttribute('content', site + '/');
        document.querySelector('meta[property="og:image"]').setAttribute('content', site + '/amrutha-table.jpg');
        document.querySelector('meta[name="twitter:image"]').setAttribute('content', site + '/amrutha-table.jpg');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
