kind = "web"
previewPath = "/"
title = "Amrutha Restaurant Website"
description = "A welcoming website for Amrutha Multi Cuisine Family Restaurant, with restaurant information, services, frequently asked questions, and search-friendly metadata."
version = "1.0.0"
id = "artifacts/amrutha-restaurant"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20467

[services.development]
run = "pnpm --filter @workspace/amrutha-restaurant run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/amrutha-restaurant", "run", "build" ]
serve = "static"
publicDir = "artifacts/amrutha-restaurant/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20467"
BASE_PATH = "/"
